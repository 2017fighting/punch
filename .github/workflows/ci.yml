name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

      # Both binaries, both architectures: punch-controller for the image's platforms,
      # punchd for the routers (amd64 today, arm64 kept buildable so a different router
      # is not a port).
      - name: build both binaries for linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          # The tag IS the version (docs/adr/0001): on a `v*` tag both binaries carry it,
          # anywhere else they say `dev`. Since no branch publishes anything, this is the
          # one place a release identity enters a binary.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME}"; else VERSION=dev; fi
          mkdir -p bin
          for arch in amd64 arm64; do
            for cmd in punchd punch-controller; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
                -o "bin/${cmd}-linux-${arch}" "./cmd/${cmd}"
            done
          done
          ls -l bin
          # punchd must stay free of the Kubernetes client libraries: it is dropped onto
          # a router (static, no cgo, no kubeconfig) and the dynamic client is the
          # controller's alone.
          if go list -deps ./cmd/punchd | grep -q '^k8s.io/'; then
            echo "::error::punchd links a k8s.io package; it must stay a plain binary"
            exit 1
          fi
          # A release whose binary cannot answer `-version` is a release with no identity,
          # and `-s -w` is exactly the flag that can silently strip one. On a tag the
          # linker's answer is checked, not assumed: punchd by running it (the runner is
          # amd64), the controller by looking for the string, since it refuses to run
          # without a token and an apiserver.
          if [ "$VERSION" != dev ]; then
            got="$(bin/punchd-linux-amd64 -version)"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::punchd -version says '$got', want '$VERSION'"
              exit 1
            fi
            if ! grep -aqF -- "$VERSION" bin/punch-controller-linux-amd64; then
              echo "::error::punch-controller-linux-amd64 does not carry '$VERSION'"
              exit 1
            fi
          fi

      - name: upload punchd (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: punchd-linux-amd64
          path: bin/punchd-linux-amd64
          if-no-files-found: error

      - name: upload punchd (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: punchd-linux-arm64
          path: bin/punchd-linux-arm64
          if-no-files-found: error

  image:
    name: build and push punch-controller
    needs: test
    # ONLY A TAG PUBLISHES. A branch push used to push `main`, and that rolling branch tag is
    # exactly the shape nothing can follow: home-ops' Renovate row can only track a `vX.Y.Z` tag,
    # so a branch build was an identity with no version signal (the failure ADR-0017 named).
    # Retired on purpose in docs/adr/0001. A pull request still builds nothing here: the registry
    # credential is the workflow token, and an unmerged commit needs no identity.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/2017fighting/punch-controller
          # No `type=ref,event=branch`: the tag is the version and the only thing consumers pin.
          # metadata-action's default `flavor: latest=auto` still adds `latest` to a semver tag,
          # and that is fine — it means "the newest release", it moves only when a `vX.Y.Z` is cut,
          # and nothing pins it (home-ops pins `:vX.Y.Z`). `sha-<short>` stays as the
          # content-addressed escape hatch for "the bytes this tag came from".
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # github.ref_name on a tag ref is `vX.Y.Z`; the Dockerfile bakes it into the
          # binary with -X, so `docker logs` names the release the tag names.
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: digest
        run: |
          echo "image digest: ${{ steps.build.outputs.digest }}"
          echo "### punch-controller \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
