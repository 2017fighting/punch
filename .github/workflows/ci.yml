name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

      # Both binaries, both architectures: punch-controller for the image's platforms,
      # punchd for the routers (amd64 today, arm64 kept buildable so a different router
      # is not a port).
      - name: build both binaries for linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          mkdir -p bin
          for arch in amd64 arm64; do
            for cmd in punchd punch-controller; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -ldflags='-s -w' \
                -o "bin/${cmd}-linux-${arch}" "./cmd/${cmd}"
            done
          done
          ls -l bin
          # punchd must stay free of the Kubernetes client libraries: it is dropped onto
          # a router (static, no cgo, no kubeconfig) and the dynamic client is the
          # controller's alone.
          if go list -deps ./cmd/punchd | grep -q '^k8s.io/'; then
            echo "::error::punchd links a k8s.io package; it must stay a plain binary"
            exit 1
          fi

      - name: upload punchd (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: punchd-linux-amd64
          path: bin/punchd-linux-amd64
          if-no-files-found: error

      - name: upload punchd (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: punchd-linux-arm64
          path: bin/punchd-linux-arm64
          if-no-files-found: error

  image:
    name: build and push punch-controller
    needs: test
    # Pull requests build nothing here: the registry credential is the workflow token, and
    # a PR does not need a published tag. `main` and `v*` do.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/2017fighting/punch-controller
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: digest
        run: |
          echo "image digest: ${{ steps.build.outputs.digest }}"
          echo "### punch-controller \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
